name: Build APK

on:
  push:
    branches: [main, v2.3-mobile-data-fix]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk KHALSA-Intercom.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KHALSA-Intercom-apk
          path: KHALSA-Intercom.apk

      - name: Publish release (easy phone download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then TAG=latest; else TAG=v2.3; fi
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" KHALSA-Intercom.apk \
            --target "$GITHUB_SHA" \
            --title "KHALSA Intercom $TAG (build ${{ github.run_number }})" \
            --notes "Tap KHALSA-Intercom.apk below to download, then install it on BOTH phones. It installs over v2.2 and keeps your family code."
