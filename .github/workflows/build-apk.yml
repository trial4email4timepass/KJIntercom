name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk KJIntercom.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KJIntercom-apk
          path: KJIntercom.apk

      - name: Publish as "latest" release (easy phone download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest KJIntercom.apk \
            --title "KJ Intercom (build ${{ github.run_number }})" \
            --notes "Tap KJIntercom.apk below to download, then install it on both phones."
